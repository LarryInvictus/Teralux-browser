<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Teralux Browser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <div class="top-left">
        <span class="brand">Teralux</span>
      </div>
      <div class="top-right">
        <button class="top-btn" id="settingsBtn">Settings</button>
      </div>
    </header>

    <main class="center">
      <!-- Logo above address bar -->
      <img src="teralux.png" alt="Teralux Logo" class="logo" />

      <form id="addressForm" class="address-form">
        <div class="address-box">
          <span class="search-icon">🌐</span>
          <input
            type="text"
            id="addressInput"
            placeholder="Enter URL or search term"
            autocomplete="off"
          />
        </div>
        <div class="buttons">
          <button type="submit" class="search-btn">Go</button>
          <button type="button" class="search-btn" id="backBtn">Back</button>
          <button type="button" class="search-btn" id="forwardBtn">Forward</button>
          <button type="button" class="search-btn" id="homeBtn">Home</button>
        </div>
      </form>

      <section class="viewport">
        <iframe id="browserFrame" src="about:blank" title="Teralux Browser"></iframe>
      </section>
    </main>

    <footer class="footer">
      <span class="footer-text">Teralux Browser</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
